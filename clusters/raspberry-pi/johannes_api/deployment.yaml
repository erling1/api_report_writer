apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-pi
  namespace: default
  labels:
    app: fastapi
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: ghcr.io/erling1/fastapi-pi:latest
          ports:
            - containerPort: 80 
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: default
spec:
  type: NodePort 
  selector:
    app: fastapi
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001
