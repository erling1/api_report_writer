apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system 
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: external-secrets
      version: ">=0.9.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    wait: true    
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    wait: true    
  values:
    installCRDs: true
