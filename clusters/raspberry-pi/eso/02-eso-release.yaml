apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system 
spec:
  interval: 1h
  # This "wait" is crucial—it forces the HelmRelease to stay in 
  # "Progressing" until the pods are healthy and CRDs are usable.
  wait: true
  timeout: 5m
  chart:
    spec:
      chart: external-secrets
      version: ">=0.9.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace # <--- Add this
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace # <--- Add this
  values:
    installCRDs: true
