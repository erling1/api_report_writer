apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eso
  namespace: flux-system
spec:
  interval: 10m                     # how often Flux should reconcile
  path: ./clusters/raspberry-pi/eso  # relative path from repo root to eso folder
  prune: true                      # cleans up removed resources
  sourceRef:
    kind: GitRepository
    name: flux-system 
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets
      namespace: flux-system
